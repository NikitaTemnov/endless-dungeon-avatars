name: Scene prompt guard tests
on:
  push:
    paths:
      - 'tools/scene-prompt-guard/**'
      - '.github/workflows/scene-guard-tests.yml'
  pull_request:
    paths:
      - 'tools/scene-prompt-guard/**'
      - '.github/workflows/scene-guard-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/scene-prompt-guard -p 'test_*.py' -v
